<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Reverie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    bg: '#09090b', surface: '#0f0f12', card: '#16161a',
                    raised: '#222228', border: '#2a2a30', dim: '#8b8b99',
                    accent: 'var(--ac-hex)',
                },
                fontFamily: {
                    sans: ['DM Sans', 'system-ui', 'sans-serif'],
                    display: ['Instrument Serif', 'serif'],
                }
            }
        }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..900;1,9..40,100..900&family=Instrument+Serif&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app"></div>

    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loading-spinner"></div>
        <div id="loadingText" class="loading-text">Loading...</div>
    </div>

    <div id="bsOverlay" class="bs-overlay" onclick="closeBottomSheet()"></div>
    <div id="bottomSheet" class="bottom-sheet">
        <div class="bs-handle"><div class="bs-handle-bar"></div></div>
        <div id="bsTitle" class="bs-title"></div>
        <div id="bsOptions" class="bs-options"></div>
    </div>

    <div id="modalOverlay" class="modal-overlay hidden">
        <div class="modal-box">
            <div id="modalTitle" class="modal-title"></div>
            <div id="modalBody" class="modal-body"></div>
            <div class="modal-actions">
                <button id="modalCancel" class="modal-btn cancel" onclick="modalResolve(false)">Cancel</button>
                <button id="modalConfirm" class="modal-btn confirm" onclick="modalResolve(true)">Confirm</button>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="app.js"></script>
    <script src="ui.js"></script>
    <script src="native.js"></script>
</body>
</html>
